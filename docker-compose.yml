services:

  database:
    image: postgres:18
    container_name: foodhub-database

    environment:
      POSTGRES_DB: foodhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodhub"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    image: foodhub-backend:latest
    container_name: foodhub-backend

    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: foodhub
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "3000:3000"

    depends_on:
      database:
        condition: service_healthy


  frontend:
    image: foodhub-frontend:latest
    container_name: foodhub-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  postgres_data: